# Local run with Docker: docker compose up --build   → site on http://localhost:8080, admin on /admin/
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: hitchload, POSTGRES_PASSWORD: hitchload, POSTGRES_DB: hitchload }
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://hitchload:hitchload@db:5432/hitchload
      ADMIN_PHONES: "+17800000001"
      PUBLIC_URL: http://localhost:8080
      LOCAL_STORAGE_DIR: /tmp/uploads
volumes:
  pgdata:
